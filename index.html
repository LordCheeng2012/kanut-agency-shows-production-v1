<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/kanut.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>KANUT-ESPECTACULOS</title>
    <style>
      :root {
        --kanut-primary: #00152f;
      }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: var(--kanut-primary);
      }

      body {
        display: block;
      }

      #root {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--kanut-primary);
      }

      .kanut-loader {
        width: 52px;
        height: 52px;
        border: 4px solid rgba(255,255,255,0.25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: kanut-spin 0.8s linear infinite;
      }

      @keyframes kanut-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="kanut-loader" aria-label="Cargando"></div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
